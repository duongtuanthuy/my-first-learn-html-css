<!DOCTYPE html>

<html>
    <head>
        <title>Password Generator</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="outer-container">
            <div id="password-generator-title">
                <span id="password-generator-w">Generate a</span>
                <span id="password-generator-gr">random password</span>
                <label id="password-hint">Never use an  insecure password again</label>
            </div>
            <div>
                <button id="generate-password-btn" onclick="generatePassword()">Generate password</button>
            </div>
            <div>
                <p id="password-answer"></p>
            </div>
            <div id="footer-console">
                <button id="copy-btn" onclick="copyPassword()">Copy</button>
                <button id="reset-btn" onclick="resetPassword()">Reset</button>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
