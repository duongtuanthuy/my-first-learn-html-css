<html>
    <head>
        <title>calculator</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="calculator-container">
            <div id="calculator-display">
                <input type="text" id="display" readonly placeholder="0">
            </div>
            <div id="calculator-console">
                <div class="number">
                    <button id="btn-1">1</button>
                    <button id="btn-2">2</button>
                    <button id="btn-3">3</button>
                    <button id="btn-4">4</button>
                    <button id="btn-5">5</button>
                    <button id="btn-6">6</button>
                    <button id="btn-7">7</button>
                    <button id="btn-8">8</button>
                    <button id="btn-9">9</button>
                    <button id="btn-0">0</button>
                </div>
                <div id="operator">
                    <button id="plus-btn">+</button>
                    <button id="minus-btn">-</button>
                    <button id="multi-btn">x</button>
                    <button id="divide-btn">/</button>
                    <button id="open-paren-btn">(</button>
                    <button id="close-paren-btn">)</button>
                    <button id="equal-btn">=</button>
                    <button id="clear-btn">C</button>
                    <button id="backspace-btn">&#9003;</button>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
